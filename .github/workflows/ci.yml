name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check . && uvx ruff format --check .
      - name: Test the hook path (standard library only, no Phonon install)
        run: uv run --no-project --with pytest pytest -q
      - name: Validate manifests
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool hooks/hooks.json > /dev/null
          python3 - <<'PY'
          import json
          a = json.load(open(".claude-plugin/plugin.json"))["version"]
          b = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"]
          assert a == b, f"plugin.json {a} != marketplace.json {b}"
          PY
