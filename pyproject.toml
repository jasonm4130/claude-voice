[project]
name = "claude-voice"
version = "0.3.0"
description = "Claude Code speaks its replies with a local Phonon voice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["ptts==0.7.1"]

[project.scripts]
claude-voice = "claude_voice.speak:main"

[project.optional-dependencies]
listen = [
    "mlx-audio==0.6.7",
    "pynput==1.8.2",
    "pyobjc-framework-cocoa==13.0",
    "sounddevice==0.5.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_voice"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
