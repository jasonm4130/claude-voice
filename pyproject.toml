[project]
name = "claude-voice"
version = "0.1.0"
description = "Claude Code speaks its replies with a local Phonon voice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["ptts==0.7.1"]

[project.scripts]
claude-voice = "claude_voice.speak:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_voice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
